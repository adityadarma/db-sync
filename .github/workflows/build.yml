name: Test DBSync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift 6.1
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test --disable-sandbox
